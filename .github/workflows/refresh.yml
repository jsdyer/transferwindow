name: Refresh TransLink transfer timetable
on:
  schedule:
    - cron: '39 8 * * *'
  workflow_dispatch:
concurrency:
  group: transit-data
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - run: python3 scripts/refresh.py
      - run: node --test tests/*.test.mjs
      - run: python3 scripts/build.py
      - name: Commit the validated snapshot and rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- web/data; then
            git add web/data
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh TransLink transfer timetable'
            git push origin HEAD:main
            gh workflow run pages.yml --ref main
          elif [ "${GITHUB_RUN_ATTEMPT}" -gt 1 ]; then
            gh workflow run pages.yml --ref main
          fi
